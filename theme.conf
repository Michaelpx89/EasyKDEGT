[General]

# --------------------------------------------------------------------------
# Background
# --------------------------------------------------------------------------
# Absolute path or relative path from theme directory.
# Leave empty to use a solid color background.
background=

# Solid background color (used when background= is empty)
backgroundColor=#0d1117

# Blur the background image (requires Qt5Compat.GraphicalEffects or QtQuick.Effects)
# true | false
blur=true

# Blur radius (higher = more blur). Only used when blur=true.
blurRadius=48

# --------------------------------------------------------------------------
# Clock
# --------------------------------------------------------------------------
# Time format string passed to Qt.formatTime()
# hh:mm       = 24-hour, no seconds
# hh:mm:ss    = 24-hour with seconds
# h:mm AP     = 12-hour with AM/PM
timeFormat=hh:mm

# Date format string passed to Qt.formatDate()
dateFormat=dddd, MMMM d

# --------------------------------------------------------------------------
# UI Appearance
# --------------------------------------------------------------------------
# Accent color used for highlights, focus rings, and active states
accentColor=#4FC3F7

# Base font size (px) for input fields and labels
fontSize=14

# --------------------------------------------------------------------------
# Login Panel
# --------------------------------------------------------------------------
# Show a list of users to click on, or just a username text field
# true | false
showUserList=true

# Show the session selector ComboBox
# true | false
showSessionSelector=true

# --------------------------------------------------------------------------
# Power Menu
# --------------------------------------------------------------------------
# Which power buttons to show (comma-separated list or "all" or "none")
# Options: shutdown, reboot, suspend, hibernate
powerButtons=shutdown,reboot,suspend
